services:
  api-django:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: portfolio-django:local
    container_name: api-django-restframework
    restart: unless-stopped
    ports:
      - "127.0.0.1:18137:8000"
    environment:
      pg_master_host: "${pg_master_host:-localhost}"
      pg_master_port: "${pg_master_port:-5432}"
      pg_master_user: "${pg_master_user:-productionuser}"
      pg_master_password: "${pg_master_password:?Set pg_master_password in .env}"
      pg_master_database: "${pg_master_database:-portfolio}"
